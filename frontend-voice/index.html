<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Weblyrix AI Voice Assistant" />
    <title>Weblyrix — AI Voice Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        background: #09090f;
        color: #e8e6ff;
        overflow-x: hidden;
      }
      body::-webkit-scrollbar {
        width: 3px;
      }
      body::-webkit-scrollbar-track {
        background: #09090f;
      }
      body::-webkit-scrollbar-thumb {
        background: #7b5cf5;
        border-radius: 2px;
      }
      ::selection {
        background: #7b5cf5;
        color: white;
      }
    </style>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
